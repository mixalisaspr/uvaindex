name: Knowledge Base build check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify learn/, sitemap.xml and sw.js match content/
        run: python3 scripts/build_kb.py --check
